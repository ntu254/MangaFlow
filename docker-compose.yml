services:
  minio:
    image: quay.io/minio/minio
    container_name: mangaflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: mangaflow
      MINIO_ROOT_PASSWORD: mangaflow123456
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
